name: PHP Composer

on:
  push:
    branches: [ "main", "develop", "release/**" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main", "develop", "release/**" ]

permissions:
  contents: read

jobs:
  release-policy:
    uses: assegaiphp/core/.github/workflows/package-policy.yml@d9f44d59d3157e55a342d101ff7157a907bf9796
    with:
      console-ref: d66c11df1916a08b10c9006862a2d8d7bfedd96f
      core-ref: 9a405927081cf3573faa38b9b87239c21707fae8
      inventory: meta/releases/0.11.json

  build:
    needs: release-policy
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php-version:
          - "8.4"
          - "8.5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
          extensions: curl, intl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit unit lane
        run: composer test

      - name: Run SQLite integration lane
        run: composer test:sqlite

  postgresql-integration:
    needs: release-policy
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assegai_pgsql_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d assegai_pgsql_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PG_DB_HOST: 127.0.0.1
      PG_DB_NAME: assegai_pgsql_test_db
      PG_DB_PORT: 5432
      PG_DB_USER: postgres
      PG_DB_PASS: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
          extensions: curl, intl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache-pgsql
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-pgsql-php-8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-pgsql-php-8.5-
            ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PostgreSQL integration lane
        run: composer test:pgsql
